name: CI

on:
  push:
    # main plus the branches development actually happens on (this repository's only
    # branch is claude/...; feat/... is the spec's suggested name)
    branches: [main, "claude/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check
      # Docker-marked tests are skipped unless R2T_DOCKER_TESTS=1.
      - run: pytest

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Build sdist and wheel
        run: python -m build
      - name: Install the wheel into a fresh virtualenv and smoke-test it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/r2t --version
          /tmp/wheel-venv/bin/r2t inspect tests/fixtures/fastapi-app --json

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2T_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: docker version && docker compose version
      - name: Real plan -> run -> HTTP check -> stop for Vite, Next.js and FastAPI
        run: pytest -m docker -v
